name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 允许手动触发工作流
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    # 仅 main 分支 push 时才发布，PR / 其他分支只跑构建
    permissions:
      id-token: write      # OIDC，用于 provenance
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run tests
      run: npm run test

    - name: Build
      run: npm run build

    # ★ 关键：publish 前删掉带 _authToken 的 .npmrc，强制走 OIDC
    - name: Remove .npmrc (force OIDC)
      run: rm -f .npmrc

    - name: Publish to NPM with provenance
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: npm publish --provenance --access public