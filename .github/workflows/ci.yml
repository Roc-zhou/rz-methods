name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        # ⚠️ 不写 registry-url，避免 setup-node 生成带 _authToken 的 ~/.npmrc

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run tests
      run: npm run test

    - name: Build
      run: npm run build

    # 清空所有可能干扰 OIDC 的 .npmrc，并显式设置 registry
    - name: Force OIDC (clean npmrc)
      run: |
        rm -f .npmrc
        rm -f ~/.npmrc
        npm config set registry https://registry.npmjs.org/
        npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
        echo "=== npmrc after clean ==="
        cat ~/.npmrc 2>/dev/null || echo "(no home .npmrc)"
        npm config list

    - name: Publish to NPM with provenance
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: npm publish --provenance --access public